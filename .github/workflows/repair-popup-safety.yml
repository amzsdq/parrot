name: Repair Popup Safety
on:
  push:
    paths: ['.github/workflows/repair-popup-safety.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/repair-popup-safety.mjs
      - run: node --check extension/popup.js
      - name: Commit exact repair
        run: |
          if git diff --quiet -- extension/popup.js; then echo 'No repair diff'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/popup.js
          git commit -m 'Repair popup numeric safety clamps'
          git push

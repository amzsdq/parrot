name: Route State Contract
on:
  push:
    paths: ['extension/**', 'tests/route-state-contract.json', 'scripts/**', '.github/workflows/route-state-contract.yml']
  pull_request:
    paths: ['extension/**', 'tests/route-state-contract.json', 'scripts/**', '.github/workflows/route-state-contract.yml']
permissions:
  contents: read
jobs:
  route-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check extension/route-state.js
      - run: node --check extension/route-queue.js
      - run: node --check extension/signal-protocol.js
      - run: node --check extension/signal-scanner.js
      - run: node --check extension/prompt-compose.js
      - run: node --check extension/repeat-policy.js
      - run: node --check extension/runner-policy.js
      - run: node --check extension/runner-registry.js
      - run: node --check extension/dashboard-model.js
      - run: node --check extension/chatgpt-adapter.js
      - run: node --check extension/background.js
      - run: node --check extension/content.js
      - run: node --check extension/dashboard.js
      - run: node --check scripts/verify-live-smoke-result.mjs
      - run: bash -n scripts/build-final-release.sh scripts/verify-release-preflight.sh scripts/verify-release-limitations.sh scripts/test-release-limitations.sh scripts/test-release-preflight.sh scripts/test-final-release-boundaries.sh
      - run: node scripts/test-route-state.mjs
      - run: node scripts/test-route-queue.mjs
      - run: node scripts/test-signal-protocol.mjs
      - run: node scripts/test-prompt-compose.mjs
      - run: node scripts/test-repeat-policy.mjs
      - run: node scripts/test-runner-policy.mjs
      - run: node scripts/test-runner-registry.mjs
      - run: node scripts/test-dashboard-controls.mjs
      - run: node scripts/test-dashboard-fleet.mjs
      - run: node scripts/test-popup-ux-contract.mjs
      - run: node scripts/test-chatgpt-adapter-structure.mjs
      - run: node scripts/test-cooldown-storage-contract.mjs
      - run: node scripts/test-live-smoke-verifier.mjs
      - run: bash scripts/test-release-limitations.sh
      - run: bash scripts/test-release-preflight.sh
      - run: bash scripts/test-final-release-boundaries.sh
      - run: node scripts/validate-contracts.mjs
      - run: node scripts/validate-v087-integration.mjs
      - run: node scripts/verify-repo.mjs
      - name: Build candidate ZIP
        run: |
          rm -f parrot-v0.8.7-candidate.zip candidate.sha256 candidate-files.txt
          (cd extension && zip -X -r ../parrot-v0.8.7-candidate.zip . -x '*.DS_Store')
          unzip -t parrot-v0.8.7-candidate.zip
          unzip -Z1 parrot-v0.8.7-candidate.zip | LC_ALL=C sort > candidate-files.txt
          sha256sum parrot-v0.8.7-candidate.zip | tee candidate.sha256
          unzip -p parrot-v0.8.7-candidate.zip manifest.json | grep -F '"version": "0.8.7"'
      - name: Upload NON-RELEASE candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: parrot-v0.8.7-candidate-NON-RELEASE-${{ github.sha }}
          path: |
            parrot-v0.8.7-candidate.zip
            candidate.sha256
            candidate-files.txt
          if-no-files-found: error
          retention-days: 14

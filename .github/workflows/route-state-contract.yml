name: Route State Contract
on:
  push:
    paths: ['extension/**', 'tests/route-state-contract.json', 'scripts/**', '.github/workflows/route-state-contract.yml']
  pull_request:
    paths: ['extension/**', 'tests/route-state-contract.json', 'scripts/**', '.github/workflows/route-state-contract.yml']
permissions:
  contents: read
jobs:
  route-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check extension/route-state.js
      - run: node --check extension/route-queue.js
      - run: node --check extension/signal-protocol.js
      - run: node --check extension/signal-scanner.js
      - run: node --check extension/prompt-compose.js
      - run: node --check extension/repeat-policy.js
      - run: node --check extension/runner-policy.js
      - run: node --check extension/runner-registry.js
      - run: node --check extension/chatgpt-adapter.js
      - run: node --check extension/background.js
      - run: node --check extension/content.js
      - run: node --check extension/dashboard.js
      - run: node scripts/test-route-state.mjs
      - run: node scripts/test-route-queue.mjs
      - run: node scripts/test-signal-protocol.mjs
      - run: node scripts/test-prompt-compose.mjs
      - run: node scripts/test-repeat-policy.mjs
      - run: node scripts/test-runner-policy.mjs
      - run: node scripts/test-runner-registry.mjs
      - run: node scripts/test-dashboard-controls.mjs
      - run: node scripts/test-chatgpt-adapter-structure.mjs
      - run: node scripts/test-cooldown-storage-contract.mjs
      - run: node scripts/validate-contracts.mjs
      - run: node scripts/validate-v087-integration.mjs
      - run: node scripts/verify-repo.mjs

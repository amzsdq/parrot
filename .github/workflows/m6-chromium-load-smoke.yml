name: M6 Chromium Load Smoke
on:
  push:
    paths: ['.github/workflows/m6-chromium-load-smoke.yml']
permissions:
  contents: read
jobs:
  chromium-load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f51e4ba53753dade3bd3f9a64e2b3c50ca05d691
      - name: Record browser and candidate
        run: |
          google-chrome --version
          test "$(git rev-parse HEAD)" = "f51e4ba53753dade3bd3f9a64e2b3c50ca05d691"
      - name: Launch and open candidate dashboard in real Chromium
        run: |
          set -euo pipefail
          EXT="$GITHUB_WORKSPACE/extension"
          PROFILE="$RUNNER_TEMP/parrot-chrome"
          EXT_ID=$(python3 - "$EXT" <<'PY'
          import hashlib,sys
          h=hashlib.sha256(sys.argv[1].encode()).hexdigest()[:32]
          print(''.join(chr(ord('a')+int(c,16)) for c in h))
          PY
          )
          echo "candidate unpacked id=$EXT_ID"
          google-chrome --headless=new --no-sandbox \
            --user-data-dir="$PROFILE" \
            --disable-extensions-except="$EXT" \
            --load-extension="$EXT" \
            --remote-debugging-port=9222 \
            --no-first-run --no-default-browser-check \
            "chrome-extension://$EXT_ID/dashboard.html" >"$RUNNER_TEMP/chrome.log" 2>&1 &
          PID=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/version > "$RUNNER_TEMP/version.json"; then ready=1; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/chrome.log" || true
          cat "$RUNNER_TEMP/version.json" || true
          test "$ready" = 1
          curl -fsS http://127.0.0.1:9222/json/list | tee "$RUNNER_TEMP/targets.json"
          grep -F "chrome-extension://$EXT_ID/dashboard.html" "$RUNNER_TEMP/targets.json"
          echo 'PASS: exact M5 candidate dashboard loaded as a real Chromium extension page.'
          kill "$PID" || true

name: Mirror Baton Log

on:
  push:
    paths:
      - 'docs/BATON.md'
      - '.github/workflows/mirror-baton-log.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve triggering baton and append safely
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:docs/BATON.md" > /tmp/trigger-baton.md
          id="$(grep -m1 '^WORK_PACKAGE_ID=' /tmp/trigger-baton.md | cut -d= -f2-)"
          test -n "$id"
          marker="## BATON SNAPSHOT — $id"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B baton-log-mirror origin/main
            if grep -Fqx "$marker" docs/DEVELOPMENT_LOG.md; then
              echo "Snapshot already present: $id"
              exit 0
            fi
            {
              printf '\n\n%s\n\n' "$marker"
              cat /tmp/trigger-baton.md
              printf '\n'
            } >> docs/DEVELOPMENT_LOG.md
            git add docs/DEVELOPMENT_LOG.md
            git commit -m "Append Parrot baton $id"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; rebuilding append from fresh main (attempt $attempt/3)"
          done
          echo "Failed to mirror baton after bounded retries" >&2
          exit 1

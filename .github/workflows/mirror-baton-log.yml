name: Mirror Baton Log

on:
  push:
    paths:
      - 'docs/BATON.md'
      - '.github/workflows/mirror-baton-log.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Append unseen baton snapshot
        shell: bash
        run: |
          set -euo pipefail
          id="$(grep -m1 '^WORK_PACKAGE_ID=' docs/BATON.md | cut -d= -f2-)"
          test -n "$id"
          marker="## BATON SNAPSHOT — $id"
          if grep -Fqx "$marker" docs/DEVELOPMENT_LOG.md; then
            echo "Snapshot already present: $id"
            exit 0
          fi
          {
            printf '\n\n%s\n\n' "$marker"
            cat docs/BATON.md
            printf '\n'
          } >> docs/DEVELOPMENT_LOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DEVELOPMENT_LOG.md
          git commit -m "Append Parrot baton $id"
          git push
